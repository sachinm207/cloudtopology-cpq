name: Monthly Multi-Cloud Pricing Sync 🔄

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Cloud Pricing Fetcher Script
        run: node scripts/update_pricing_catalog.js

      - name: Run Test Suite & Build Verification
        run: |
          npm test
          npm run build

      - name: Create Pull Request with Updated Pricing
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(pricing): Monthly sync of cloud rate cards and egress tiers"
          title: "🔄 Monthly Multi-Cloud Pricing Catalog Update"
          body: |
            ### Automated Monthly Cloud Rate Book Sync
            This automated PR synchronizes multi-cloud baseline pricing from public cloud APIs:
            - **AWS Price List API**
            - **GCP Cloud Billing Catalog**
            - **Azure Retail Prices API**
            - **Cloudflare Developer Platform**

            ✅ Unit tests and production build passed with zero errors.
          branch: automated-pricing-sync
          delete-branch: true
